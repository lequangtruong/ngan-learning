<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ngân Learning Lab · Toán Lớp 6 Nâng Cao</title>
  <meta name="description" content="Nền tảng học Toán Lớp 6 Nâng Cao & Rèn Luyện Tư Duy cho Ngân - Tối ưu iPad Air M1 10.9 inch" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- Fonts: Be Vietnam Pro cho tiếng Việt & Outfit/JetBrains Mono cho số học -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="theme-notebook">
  <!-- Thanh điều hướng trên cùng (Topbar) -->
  <header class="app-topbar" id="appTopbar">
    <a href="#home" class="topbar-brand" id="topbarBrandLink" title="Về trang chủ">
      <span class="brand-logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M4 21V7l8 14M4 14h4" />
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">Ngân Learning Lab</span>
        <span class="brand-badge">Toán 6 Nâng Cao</span>
      </div>
    </a>

    <div class="topbar-actions">
      <!-- Bộ đếm thời gian học tập -->
      <div class="timer-chip" id="studyTimerWidget" title="Thời gian học tập trung" style="display: none;">
        <span class="timer-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4M12 2v3"/>
          </svg>
        </span>
        <span class="timer-digits" id="timerDisplay">25:00</span>
        <button type="button" class="timer-btn" id="timerToggleBtn" aria-label="Bắt đầu/Tạm dừng">▶</button>
      </div>

      <!-- Trạng thái kết nối & Đồng bộ -->
      <div class="sync-status-chip" id="syncStatusChip" title="Trạng thái lưu trữ cục bộ & Drive">
        <span class="sync-dot online"></span>
        <span class="sync-text" id="syncStatusText">Offline-First</span>
      </div>

      <!-- Nút Cập Nhật Bài Học Trên Cùng -->
      <button type="button" class="btn-topbar-update" id="topbarUpdateBtn" aria-label="Cập nhật bài học mới" title="Bấm để tải lại bài học mới nhất sau khi sửa">
        <svg class="update-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span class="update-text">Cập nhật</span>
        <span class="update-badge" id="updateBadge" style="display:none;">Mới</span>
      </button>
      <span id="topbarUpdateLiveNotice" class="sr-only" role="status" aria-live="polite"></span>
    </div>
  </header>

  <!-- Vùng hiển thị nội dung chính theo Route -->
  <main id="app" class="app-viewport" role="main">
    <div class="view-loading">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu học tập Toán 6...</p>
    </div>
  </main>

  <!-- Thanh công cụ điều hướng dưới đáy (Docked Bottom Nav) -->
  <nav class="app-bottom-nav" id="bottomNav" role="navigation" aria-label="Menu chính">
    <a href="#home" class="nav-item active" id="nav-home">
      <span class="nav-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
        </svg>
      </span>
      <span class="nav-label">Trang Chủ</span>
    </a>
    <a href="#math" class="nav-item" id="nav-math">
      <span class="nav-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </span>
      <span class="nav-label">Bài Học</span>
    </a>
    <a href="#games" class="nav-item" id="nav-games">
      <span class="nav-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="11" x2="15.01" y2="11"/><line x1="18" y1="13" x2="18.01" y2="13"/>
        </svg>
      </span>
      <span class="nav-label">Trò Chơi</span>
    </a>
    <a href="#competency" class="nav-item" id="nav-competency">
      <span class="nav-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </span>
      <span class="nav-label">Năng Lực</span>
    </a>
    <a href="#parent" class="nav-item" id="nav-parent">
      <span class="nav-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </span>
      <span class="nav-label">Phụ Huynh</span>
    </a>
  </nav>

  <!-- Script Khởi Động Chính -->
  <script type="module" src="./app.js"></script>
</body>
</html>
